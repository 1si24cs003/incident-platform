<!DOCTYPE html>
<html>
<head>
  <title>Incident Reporting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>🚨 Incident Reporting Platform</h2>
  <nav>
    <a href="login.html">Admin / Responder Login</a>
  </nav>
</header>

<div class="container">

  <div class="card">
    <h3>Report an Incident</h3>
    <select id="type">
      <option>Accident</option>
      <option>Medical</option>
      <option>Fire</option>
    </select>
    <input id="desc" placeholder="Description">
    <input id="lat" placeholder="Latitude">
    <input id="lng" placeholder="Longitude">
    <button onclick="report()">Submit</button>
  </div>

  <h3>Live Incidents</h3>
  <div id="list"></div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
